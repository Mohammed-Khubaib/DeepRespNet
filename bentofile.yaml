service: "service:svc"

name: deeprespnet

description: "DeepRespNet Model Deployed using BentoML"

labels:
  owner: Mohammed-Khubaib
  stage: ready

include:
  - service.py
  - src/prediction/
  - src/features/
  - requirements.txt

exclude:
  - ".git/"
  - "__pycache__/"
  - "*.pyc"
  - ".gitignore"
  - "tests/"
  - "notebooks/"
  - ".DS_Store"

models:
  - "peepseek:latest" # A string model tag
  - tag: "peepseek:eccibidgg6acmt5m"  # A dictionary

python:
  packages:
    - "audiomentations>=0.42.0"
    - "bentoml>=1.4.17"
    - "keras>=3.10.0"
    - "librosa>=0.11.0"
    - "numpy>=2.1.3"
    - "pandas>=2.3.1"
    - "pydantic>=2.11.7"
    - "pydot>=4.0.1"
    - "resampy>=0.4.3"
    - "mlflow>=3.1.1"
    - "tensorflow==2.19.0"